[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rinse"
version = "0.1.0"
description = "Turn any Indian public dataset into a clean, versioned API in one command."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Team Akira" }]
dependencies = [
    "pandas>=1.5",
    "openpyxl>=3.1",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
rinse = "rinse.cli:main"

[tool.setuptools]
packages = ["rinse", "rinse.cleaners"]

[tool.setuptools.package-data]
rinse = ["rules/*.csv"]
